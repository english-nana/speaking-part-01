<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang Giáo Viên — Quản lý Học viên & Bài làm (Speaking Part 1)</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .teacher-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .teacher-stat-card {
      background: #FFFFFF;
      border: 2px solid #18181B;
      box-shadow: 3px 3px 0px #18181B;
      padding: 14px 16px;
    }
    .teacher-stat-label {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: #52525B;
      letter-spacing: 0.04em;
    }
    .teacher-stat-value {
      font-size: 26px;
      font-weight: 900;
      color: #18181B;
      margin-top: 4px;
      font-family: var(--font-mono);
    }
    .teacher-tabs-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .teacher-tab-btn {
      padding: 9px 16px;
      border: 2px solid #18181B;
      background: #FFFFFF;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      color: #18181B;
      transition: transform 0.1s ease, background 0.1s ease;
    }
    .teacher-tab-btn.active {
      background: var(--accent-yellow);
      box-shadow: 3px 3px 0px #18181B;
    }
    .teacher-filter-bar {
      border: 2px solid #18181B;
      background: #FFFFFF;
      padding: 14px 18px;
      box-shadow: 3px 3px 0px #18181B;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .teacher-students-table {
      width: 100%;
      border-collapse: collapse;
      background: #FFFFFF;
      border: 2px solid #18181B;
      box-shadow: 3px 3px 0px #18181B;
      font-size: 13.5px;
    }
    .teacher-students-table th {
      background: #F4F4F5;
      text-align: left;
      padding: 11px 14px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 2px solid #18181B;
    }
    .teacher-students-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #E4E4E7;
      vertical-align: middle;
    }
    .provider-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid #D4D4D8;
      background: #FAFAFA;
      color: #3F3F46;
    }
    .provider-pill.google {
      background: #EFF6FF;
      border-color: #BFDBFE;
      color: #1D4ED8;
    }
    .grade-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .save-grade-btn {
      height: 36px;
      padding: 0 14px;
      border: 2px solid #18181B;
      background: #18181B;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
    }
    .save-grade-btn:hover {
      background: #27272A;
    }
    .cloud-mode-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border: 1.5px solid #18181B;
      background: #DCFCE7;
      color: #166534;
    }
  </style>
</head>
<body>
  <div id="teacher-app"></div>
  <script src="./supabase-config.js"></script>
  <script src="./supabase-client.js"></script>
  <script src="./travel-data.js"></script>
  <script>
    (function () {
      const TEACHER_SESSION_KEY = "speaking_part1_teacher_key_v1";
      const TOPICS = window.SPEAKING_TOPICS || [];
      const CLOUD = window.SpeakingCloud || { isEnabled: () => false };

      function isCloudMode() {
        return Boolean(CLOUD && CLOUD.isEnabled && CLOUD.isEnabled());
      }

      let tState = {
        loading: false,
        authenticated: false,
        unauthorizedEmail: "",
        teacherEmail: "",
        teacherKey: sessionStorage.getItem(TEACHER_SESSION_KEY) || "",
        authError: "",
        activeTab: "submissions", // "submissions" | "students"
        // Normalized structures used by both Cloud & Local modes
        students: [], // { id, name, email, authProvider, createdAt, lastActiveAt, vocabCount }
        submissions: [], // { attemptId, studentId, studentName, studentEmail, authProvider, qId, topicId, topicTitle, questionNum, prompt, ideaNote, isOfficiallySubmitted, submittedAt, createdAt, durationSec, takeNum, totalAttemptsCount, audioUrl, transcript, teacherFeedback, teacherScore }
        rawLocalDb: { accounts: {} },
        filterStudent: "all",
        filterTopic: "all",
        filterStatus: "all", // "all" | "submitted" | "ungraded" | "graded"
        savedToastId: ""
      };

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function formatDuration(sec) {
        const m = Math.floor((sec || 0) / 60);
        const s = (sec || 0) % 60;
        return `${m}:${s < 10 ? "0" : ""}${s}`;
      }

      function buildQuestionMetaMap() {
        const map = {};
        TOPICS.forEach(t => {
          (t.questions || []).forEach(q => {
            map[q.id] = { topicId: t.id, topicTitle: t.title, prompt: q.prompt, num: q.num };
          });
        });
        return map;
      }

      function renderGoogleIconSvg(size) {
        const s = size || 18;
        return `
          <svg width="${s}" height="${s}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        `;
      }

      // ======================================================================
      // CLOUD DATA LOADER (SUPABASE + SERVER-SIDE RLS VERIFICATION)
      // ======================================================================
      async function verifyAndLoadCloudTeacher(user) {
        const client = CLOUD.getClient();
        if (!client || !user) return;

        tState.loading = true;
        tState.authError = "";
        tState.unauthorizedEmail = "";
        renderTeacherApp();

        // Check server-side teacher permission via SQL RPC function is_teacher()
        const { data: isTeacherFlag, error: rpcError } = await client.rpc("is_teacher");
        if (rpcError || !isTeacherFlag) {
          tState.loading = false;
          tState.authenticated = false;
          tState.unauthorizedEmail = user.email || "";
          renderTeacherApp();
          return;
        }

        tState.authenticated = true;
        tState.teacherEmail = user.email || "";
        await refreshCloudDashboardData();
      }

      async function refreshCloudDashboardData() {
        const client = CLOUD.getClient();
        if (!client) return;

        tState.loading = true;
        renderTeacherApp();

        const [profilesRes, vocabRes, notesRes, attemptsRes] = await Promise.all([
          client.from("profiles").select("*").order("last_active_at", { ascending: false }),
          client.from("student_vocab").select("user_id"),
          client.from("question_notes").select("*"),
          client.from("speaking_attempts").select("*").order("created_at", { ascending: false })
        ]);

        const profiles = Array.isArray(profilesRes.data) ? profilesRes.data : [];
        const vocabRows = Array.isArray(vocabRes.data) ? vocabRes.data : [];
        const noteRows = Array.isArray(notesRes.data) ? notesRes.data : [];
        const attemptRows = Array.isArray(attemptsRes.data) ? attemptsRes.data : [];

        const vocabCountByUser = {};
        vocabRows.forEach(v => {
          vocabCountByUser[v.user_id] = (vocabCountByUser[v.user_id] || 0) + 1;
        });

        const notesMap = {};
        noteRows.forEach(n => {
          notesMap[`${n.user_id}__${n.question_id}`] = n.idea_note || "";
        });

        const profileById = {};
        profiles.forEach(p => {
          profileById[p.id] = p;
        });

        // Batch-fetch private signed audio URLs (2-hour TTL)
        const signedUrlMap = await CLOUD.getSignedAudioUrls(attemptRows.map(a => a.audio_path).filter(Boolean));

        // Group attempts by (user_id, question_id) so we pick the officially submitted take (or latest draft)
        const grouped = {};
        attemptRows.forEach(att => {
          const k = `${att.user_id}__${att.question_id}`;
          if (!grouped[k]) grouped[k] = [];
          grouped[k].push(att);
        });

        const qMetaMap = buildQuestionMetaMap();
        const submittedCountByUser = {};
        const submissions = [];

        Object.keys(grouped).forEach(k => {
          const list = grouped[k];
          const chosen = list.find(a => a.is_submitted) || list[0];
          const prof = profileById[chosen.user_id] || {
            id: chosen.user_id,
            full_name: "Học viên",
            email: "",
            auth_provider: "email"
          };
          const qMeta = qMetaMap[chosen.question_id] || {
            topicId: chosen.topic_id || "other",
            topicTitle: chosen.topic_id || "Chủ đề",
            prompt: chosen.question_id,
            num: 1
          };

          if (chosen.is_submitted) {
            submittedCountByUser[chosen.user_id] = (submittedCountByUser[chosen.user_id] || 0) + 1;
          }

          submissions.push({
            attemptId: chosen.id,
            studentId: chosen.user_id,
            studentName: prof.full_name || prof.email || "Học viên",
            studentEmail: prof.email || "",
            authProvider: prof.auth_provider || "email",
            qId: chosen.question_id,
            topicId: qMeta.topicId,
            topicTitle: qMeta.topicTitle,
            questionNum: qMeta.num,
            prompt: qMeta.prompt,
            ideaNote: notesMap[k] || "",
            isOfficiallySubmitted: Boolean(chosen.is_submitted),
            submittedAt: CLOUD.formatDateTime(chosen.submitted_at || chosen.created_at),
            rawTime: new Date(chosen.submitted_at || chosen.created_at || 0).getTime(),
            durationSec: chosen.duration_sec || 0,
            takeNum: chosen.take_number || 1,
            totalAttemptsCount: list.length,
            audioUrl: chosen.audio_path ? signedUrlMap[chosen.audio_path] || "" : "",
            transcript: chosen.transcript || "",
            teacherFeedback: chosen.teacher_feedback || "",
            teacherScore: chosen.teacher_score || ""
          });
        });

        // Sort newest submitted first
        submissions.sort((a, b) => {
          if (a.isOfficiallySubmitted !== b.isOfficiallySubmitted) {
            return a.isOfficiallySubmitted ? -1 : 1;
          }
          return (b.rawTime || 0) - (a.rawTime || 0);
        });

        tState.students = profiles.map(p => ({
          id: p.id,
          name: p.full_name || p.email,
          email: p.email,
          authProvider: p.auth_provider || "email",
          createdAt: CLOUD.formatDateTime(p.created_at),
          lastActiveAt: CLOUD.formatDateTime(p.last_active_at),
          vocabCount: vocabCountByUser[p.id] || 0,
          submittedCount: submittedCountByUser[p.id] || 0
        }));

        tState.submissions = submissions;
        tState.loading = false;
        renderTeacherApp();
      }

      async function saveCloudGrade(attemptId, scoreVal, feedbackVal) {
        const client = CLOUD.getClient();
        if (!client) return;
        const { error } = await client
          .from("speaking_attempts")
          .update({
            teacher_score: scoreVal,
            teacher_feedback: feedbackVal
          })
          .eq("id", attemptId);
        if (!error) {
          const item = tState.submissions.find(s => s.attemptId === attemptId);
          if (item) {
            item.teacherScore = scoreVal;
            item.teacherFeedback = feedbackVal;
          }
          tState.savedToastId = attemptId;
          renderTeacherApp();
          setTimeout(() => {
            if (tState.savedToastId === attemptId) {
              tState.savedToastId = "";
              renderTeacherApp();
            }
          }, 2200);
        } else {
          alert("Lỗi lưu nhận xét: " + error.message);
        }
      }

      // ======================================================================
      // LOCAL FALLBACK MODE (WHEN supabase-config.js IS EMPTY)
      // ======================================================================
      function hydrateLocalDb(rawDb) {
        tState.rawLocalDb = rawDb || { accounts: {} };
        const accountsList = Object.values(tState.rawLocalDb.accounts || {});
        const qMetaMap = buildQuestionMetaMap();
        const students = [];
        const submissions = [];

        accountsList.forEach(student => {
          const qdMap = student.questionsData || {};
          let subCount = 0;

          Object.keys(qdMap).forEach(qId => {
            const qd = qdMap[qId];
            const qMeta = qMetaMap[qId] || { topicId: "other", topicTitle: "Chủ đề", prompt: qId, num: 1 };
            const attempts = qd.attempts || [];
            const subTake =
              attempts.find(a => a.id === qd.submittedTakeId) ||
              (attempts.length > 0 ? attempts[attempts.length - 1] : null);
            if (qd.submittedTakeId) subCount++;

            if (subTake || qd.ideaNote) {
              submissions.push({
                attemptId: subTake ? subTake.id : `${student.email}__${qId}`,
                studentId: student.email,
                studentName: student.name,
                studentEmail: student.email,
                authProvider: student.authProvider || "email",
                qId: qId,
                topicId: qMeta.topicId,
                topicTitle: qMeta.topicTitle,
                questionNum: qMeta.num,
                prompt: qMeta.prompt,
                ideaNote: qd.ideaNote || "",
                isOfficiallySubmitted: Boolean(qd.submittedTakeId),
                submittedAt: qd.submittedAt || (subTake ? subTake.createdAt : ""),
                durationSec: subTake ? subTake.durationSec : 0,
                takeNum: subTake ? subTake.num : 1,
                totalAttemptsCount: attempts.length,
                audioUrl: subTake ? subTake.audioDataUrl || subTake.savedAudioFile || "" : "",
                transcript: subTake ? subTake.transcript || "" : "",
                teacherFeedback: qd.teacherFeedback || "",
                teacherScore: qd.teacherScore || ""
              });
            }
          });

          students.push({
            id: student.email,
            name: student.name,
            email: student.email,
            authProvider: student.authProvider || "email",
            createdAt: student.createdAt || "",
            lastActiveAt: "",
            vocabCount: (student.savedVocab || []).length,
            submittedCount: subCount
          });
        });

        tState.students = students;
        tState.submissions = submissions;
      }

      async function fetchLocalTeacherDb(key) {
        try {
          const res = await fetch(`/api/teacher/db?key=${encodeURIComponent(key)}`, { cache: "no-store" });
          if (res.status === 403) {
            return { ok: false, error: "Mật khẩu Giáo viên không chính xác." };
          }
          if (res.ok) {
            const data = await res.json();
            return { ok: true, data };
          }
        } catch (e) {}
        return { ok: false, error: "Không kết nối được tới máy chủ nội bộ (server.py)." };
      }

      async function saveLocalTeacherDb() {
        try {
          await fetch("/api/db", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(tState.rawLocalDb)
          });
        } catch (e) {}
      }

      // ======================================================================
      // EXPORT CSV (EXCEL-READY WITH UTF-8 BOM)
      // ======================================================================
      function exportCsvReport(rows) {
        const csvCell = v => `"${String(v || "").replace(/"/g, '""')}"`;
        const header = [
          "Học viên",
          "Email",
          "Chủ đề",
          "Câu hỏi",
          "Trạng thái",
          "Thời gian nộp",
          "Thời lượng (giây)",
          "Ghi chú ý tưởng",
          "Transcript bài nói",
          "Điểm / Band",
          "Nhận xét giáo viên"
        ];
        const lines = [header.map(csvCell).join(",")];
        rows.forEach(sub => {
          lines.push(
            [
              sub.studentName,
              sub.studentEmail,
              sub.topicTitle,
              `Q${sub.questionNum}: ${sub.prompt}`,
              sub.isOfficiallySubmitted ? "Đã nộp chính thức" : "Bản nháp",
              sub.submittedAt,
              sub.durationSec,
              sub.ideaNote,
              sub.transcript,
              sub.teacherScore,
              sub.teacherFeedback
            ]
              .map(csvCell)
              .join(",")
          );
        });
        const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `bao-cao-speaking-part1-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      // ======================================================================
      // RENDERING VIEWS
      // ======================================================================
      function renderUnauthorizedView() {
        return `
          <div class="auth-wrapper">
            <div class="auth-card-box">
              <div style="margin-bottom:10px;">
                <span style="font-family:var(--font-mono);font-size:11.5px;font-weight:800;background:#FEE2E2;color:#991B1B;padding:3px 9px;border:1.5px solid #18181B;">
                  KHÔNG CÓ QUYỀN TRUY CẬP
                </span>
              </div>
              <h1 style="font-size:21px;font-weight:900;color:#18181B;margin-bottom:8px;">
                Tài khoản không phải Giáo viên
              </h1>
              <p style="font-size:13.5px;color:#52525B;line-height:1.55;margin-bottom:16px;">
                Tài khoản <strong>${escapeHtml(tState.unauthorizedEmail)}</strong> chưa có trong danh sách bảng <code>public.teachers</code> trên Supabase nên hệ thống tự động chặn quyền đọc dữ liệu học viên.
              </p>
              <button type="button" class="form-submit-btn" id="btn-teacher-logout">
                Đăng xuất & Đăng nhập tài khoản Giáo viên →
              </button>
            </div>
          </div>
        `;
      }

      function renderTeacherLogin() {
        if (isCloudMode()) {
          return `
            <div class="auth-wrapper">
              <div class="auth-card-box">
                <div style="margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                  <span style="font-family:var(--font-mono);font-size:11.5px;font-weight:800;background:#DCFCE7;color:#166534;padding:3px 9px;border:1.5px solid #18181B;">
                    TRANG GIÁO VIÊN · SUPABASE CLOUD
                  </span>
                </div>
                <h1 style="font-size:22px;font-weight:900;color:#18181B;margin-bottom:6px;">
                  Đăng nhập Quản trị Giáo viên
                </h1>
                <p style="font-size:13.5px;color:#52525B;line-height:1.55;margin-bottom:16px;">
                  Đăng nhập bằng chính tài khoản <strong>Gmail Giáo viên</strong> đã khai báo trong Supabase để quản lý học viên, nghe lại bài ghi âm và ghi nhận xét.
                </p>

                ${
                  tState.authError
                    ? `<div style="padding:8px 12px;border:1.5px solid #DC2626;background:#FEF2F2;color:#B91C1C;font-size:12.5px;font-weight:700;margin-bottom:12px;">⚠️ ${escapeHtml(tState.authError)}</div>`
                    : ""
                }

                <button type="button" class="google-auth-btn" id="btn-teacher-google-login" ${tState.loading ? "disabled" : ""}>
                  ${renderGoogleIconSvg(19)}
                  <span>${tState.loading ? "Đang xác thực quyền Giáo viên..." : "Đăng nhập Giáo viên bằng Google"}</span>
                </button>

                <div class="auth-or-divider">
                  <span>Hoặc đăng nhập Email Giáo viên</span>
                </div>

                <form id="teacher-cloud-email-form" onsubmit="return false;">
                  <div class="form-field">
                    <label class="form-label" for="inp-teacher-email">Email Giáo viên</label>
                    <input type="email" id="inp-teacher-email" class="form-input" placeholder="giaovien@gmail.com" required />
                  </div>
                  <div class="form-field">
                    <label class="form-label" for="inp-teacher-pass">Mật khẩu</label>
                    <input type="password" id="inp-teacher-pass" class="form-input" placeholder="Nhập mật khẩu..." required />
                  </div>
                  <button type="submit" class="form-submit-btn" ${tState.loading ? "disabled" : ""}>
                    Đăng nhập trang Giáo viên →
                  </button>
                </form>
              </div>
            </div>
          `;
        }

        // Local fallback login
        return `
          <div class="auth-wrapper">
            <div class="auth-card-box">
              <div style="margin-bottom:10px;">
                <span style="font-family:var(--font-mono);font-size:11.5px;font-weight:800;background:#FEF3C7;color:#92400E;padding:3px 9px;border:1.5px solid #18181B;">
                  CHẾ ĐỘ NỘI BỘ (CHƯA KẾT NỐI SUPABASE)
                </span>
              </div>
              <h1 style="font-size:22px;font-weight:900;color:#18181B;margin-bottom:6px;">
                Quản lý & Xem Bài làm Học viên
              </h1>
              <p style="font-size:13.5px;color:#52525B;line-height:1.5;margin-bottom:14px;">
                Hiện web đang chạy ở chế độ máy cá nhân (<code>server.py</code>). Khi bạn điền khóa vào <code>supabase-config.js</code> để đưa lên GitHub Pages, trang này sẽ tự động chuyển sang đăng nhập Google bảo mật theo quyền Giáo viên.
              </p>

              ${
                tState.authError
                  ? `<div style="padding:8px 12px;border:1.5px solid #DC2626;background:#FEF2F2;color:#B91C1C;font-size:12.5px;font-weight:700;margin-bottom:12px;">⚠️ ${escapeHtml(tState.authError)}</div>`
                  : ""
              }

              <form id="teacher-local-login-form" onsubmit="return false;">
                <div class="form-field">
                  <label class="form-label" for="inp-teacher-key">Mật khẩu Giáo viên nội bộ</label>
                  <input type="password" id="inp-teacher-key" class="form-input" placeholder="Mặc định: admin123" required autofocus />
                </div>
                <button type="submit" class="form-submit-btn">
                  Mở Hồ sơ Bài làm Học viên →
                </button>
              </form>
            </div>
          </div>
        `;
      }

      function getFilteredSubmissions() {
        return tState.submissions.filter(sub => {
          if (tState.filterStudent !== "all" && sub.studentEmail !== tState.filterStudent) return false;
          if (tState.filterTopic !== "all" && sub.topicId !== tState.filterTopic) return false;
          if (tState.filterStatus === "submitted" && !sub.isOfficiallySubmitted) return false;
          if (tState.filterStatus === "ungraded" && (sub.teacherFeedback || sub.teacherScore)) return false;
          if (tState.filterStatus === "graded" && !sub.teacherFeedback && !sub.teacherScore) return false;
          return true;
        });
      }

      function renderTeacherDashboard() {
        const filteredSubs = getFilteredSubmissions();
        const totalSubmitted = tState.submissions.filter(s => s.isOfficiallySubmitted).length;
        const totalUngraded = tState.submissions.filter(s => s.isOfficiallySubmitted && !s.teacherFeedback && !s.teacherScore).length;
        const totalVocab = tState.students.reduce((acc, s) => acc + (s.vocabCount || 0), 0);
        const totalQuestionsAllTopics = TOPICS.reduce((acc, t) => acc + (t.questions || []).length, 0);

        return `
          <div class="home-shell">
            <header class="home-topbar" style="background:#F0FDF4;">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <div class="home-brand-title">👨‍🏫 TRANG GIÁO VIÊN · SPEAKING PART 1</div>
                <span class="cloud-mode-pill">${isCloudMode() ? "☁️ SUPABASE CLOUD" : "💻 LOCAL SERVER"}</span>
              </div>

              <div class="topbar-actions">
                <a href="./index.html" class="top-pill-btn" style="text-decoration:none;">← Về trang luyện tập</a>
                <button type="button" class="top-pill-btn" id="btn-refresh-data">
                  ${tState.loading ? "⏳ Đang tải..." : "↻ Làm mới"}
                </button>
                <button type="button" class="top-pill-btn yellow" id="btn-export-csv">📊 Xuất Excel (.csv)</button>
                <button type="button" class="user-account-pill" id="btn-teacher-logout">
                  <span>${escapeHtml(tState.teacherEmail || "Giáo viên")} · Đăng xuất</span>
                </button>
              </div>
            </header>

            <main class="home-container">
              <!-- STATS CARDS -->
              <div class="teacher-stats-grid">
                <div class="teacher-stat-card">
                  <div class="teacher-stat-label">Tổng số học viên</div>
                  <div class="teacher-stat-value">${tState.students.length}</div>
                </div>
                <div class="teacher-stat-card">
                  <div class="teacher-stat-label">Bài đã nộp chính thức</div>
                  <div class="teacher-stat-value" style="color:#15803D;">${totalSubmitted}</div>
                </div>
                <div class="teacher-stat-card">
                  <div class="teacher-stat-label">Bài chờ chấm / nhận xét</div>
                  <div class="teacher-stat-value" style="color:#B45309;">${totalUngraded}</div>
                </div>
                <div class="teacher-stat-card">
                  <div class="teacher-stat-label">Tổng từ vựng học viên lưu</div>
                  <div class="teacher-stat-value">${totalVocab}</div>
                </div>
              </div>

              <!-- TABS -->
              <div class="teacher-tabs-bar">
                <button type="button" class="teacher-tab-btn ${tState.activeTab === "submissions" ? "active" : ""}" data-teacher-tab="submissions">
                  🎙️ Bài làm & Ghi âm (${tState.submissions.length})
                </button>
                <button type="button" class="teacher-tab-btn ${tState.activeTab === "students" ? "active" : ""}" data-teacher-tab="students">
                  👥 Quản lý Tài khoản Học viên (${tState.students.length})
                </button>
              </div>

              ${
                tState.activeTab === "students"
                  ? renderStudentsManagementTab(totalQuestionsAllTopics)
                  : renderSubmissionsTab(filteredSubs)
              }
            </main>
          </div>
        `;
      }

      function renderStudentsManagementTab(totalQuestionsAllTopics) {
        if (tState.students.length === 0) {
          return `
            <div style="padding:36px;text-align:center;border:2px dashed #D4D4D8;background:#FFFFFF;color:#52525B;">
              <p style="font-size:15.5px;font-weight:700;">Chưa có tài khoản học viên nào đăng ký.</p>
            </div>
          `;
        }

        return `
          <div style="overflow-x:auto;">
            <table class="teacher-students-table">
              <thead>
                <tr>
                  <th>Học viên</th>
                  <th>Đăng nhập qua</th>
                  <th>Tiến độ nộp bài</th>
                  <th>Kho từ vựng</th>
                  <th>Ngày tham gia</th>
                  <th>Hoạt động gần nhất</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody>
                ${tState.students
                  .map(st => `
                    <tr>
                      <td>
                        <div style="font-weight:800;color:#18181B;">${escapeHtml(st.name)}</div>
                        <div style="font-size:12px;color:#71717A;">${escapeHtml(st.email)}</div>
                      </td>
                      <td>
                        <span class="provider-pill ${st.authProvider === "google" ? "google" : ""}">
                          ${st.authProvider === "google" ? "Google" : "Email"}
                        </span>
                      </td>
                      <td>
                        <strong>${st.submittedCount}</strong> / ${totalQuestionsAllTopics} câu
                      </td>
                      <td>${st.vocabCount} từ</td>
                      <td style="font-size:12.5px;color:#52525B;">${escapeHtml(st.createdAt || "—")}</td>
                      <td style="font-size:12.5px;color:#52525B;">${escapeHtml(st.lastActiveAt || "—")}</td>
                      <td>
                        <button type="button" class="top-pill-btn" data-view-student-subs="${escapeHtml(st.email)}">
                          Xem bài làm →
                        </button>
                      </td>
                    </tr>
                  `)
                  .join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderSubmissionsTab(filteredSubs) {
        return `
          <div class="teacher-filter-bar">
            <div style="font-size:13.5px;font-weight:700;color:#18181B;">
              Đang hiển thị <strong>${filteredSubs.length}</strong> bài làm
            </div>

            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <select id="sel-filter-student" class="form-input" style="height:36px;width:auto;font-size:13px;font-weight:600;">
                <option value="all">Tất cả học viên (${tState.students.length})</option>
                ${tState.students
                  .map(
                    a => `
                    <option value="${escapeHtml(a.email)}" ${tState.filterStudent === a.email ? "selected" : ""}>
                      ${escapeHtml(a.name)} (${escapeHtml(a.email)})
                    </option>
                  `
                  )
                  .join("")}
              </select>

              <select id="sel-filter-topic" class="form-input" style="height:36px;width:auto;font-size:13px;font-weight:600;">
                <option value="all">Tất cả đề luyện tập</option>
                ${TOPICS.map(
                  t => `
                    <option value="${t.id}" ${tState.filterTopic === t.id ? "selected" : ""}>
                      Đề ${t.number}: ${escapeHtml(t.title)}
                    </option>
                  `
                ).join("")}
              </select>

              <select id="sel-filter-status" class="form-input" style="height:36px;width:auto;font-size:13px;font-weight:600;">
                <option value="all" ${tState.filterStatus === "all" ? "selected" : ""}>Mọi trạng thái</option>
                <option value="submitted" ${tState.filterStatus === "submitted" ? "selected" : ""}>Chỉ bài đã nộp chính thức</option>
                <option value="ungraded" ${tState.filterStatus === "ungraded" ? "selected" : ""}>Chưa nhận xét</option>
                <option value="graded" ${tState.filterStatus === "graded" ? "selected" : ""}>Đã có nhận xét</option>
              </select>
            </div>
          </div>

          ${
            filteredSubs.length === 0
              ? `
              <div style="padding:36px;text-align:center;border:2px dashed #D4D4D8;background:#FFFFFF;color:#52525B;">
                <p style="font-size:16px;font-weight:700;margin-bottom:6px;">Chưa có bài làm nào khớp bộ lọc.</p>
                <p style="font-size:13.5px;">Khi học viên ghi âm và bấm Nộp bài trên web, bản ghi âm và transcript sẽ tự động đồng bộ về đây.</p>
              </div>
            `
              : filteredSubs
                  .map(
                    sub => `
                    <div class="submission-review-card" style="border:2px solid #18181B;box-shadow:3px 3px 0px #18181B;">
                      <div class="submission-review-top">
                        <div>
                          <span style="font-size:14.5px;font-weight:800;color:#18181B;">
                            👤 ${escapeHtml(sub.studentName)}
                          </span>
                          <span style="font-size:12.5px;color:#71717A;margin-left:4px;">(${escapeHtml(sub.studentEmail)})</span>
                          <span style="margin:0 6px;color:#D4D4D8;">|</span>
                          <span style="font-size:12.5px;font-weight:700;color:#92400E;background:#FEF3C7;padding:2px 8px;border-radius:4px;">
                            ${escapeHtml(sub.topicTitle)} · Câu ${sub.questionNum}
                          </span>
                        </div>

                        <div>
                          ${
                            sub.isOfficiallySubmitted
                              ? `<span class="submitted-badge">✓ Đã nộp chính thức (${escapeHtml(sub.submittedAt || "")})</span>`
                              : `<span style="font-size:11.5px;font-weight:600;color:#B45309;background:#FFFBEB;padding:2px 8px;border-radius:4px;">Bản ghi nháp (${sub.totalAttemptsCount} lần ghi)</span>`
                          }
                        </div>
                      </div>

                      <div style="font-size:15.5px;font-weight:700;color:#18181B;margin-bottom:10px;">
                        Câu hỏi: “${escapeHtml(sub.prompt)}”
                      </div>

                      ${
                        sub.ideaNote
                          ? `
                          <div style="padding:9px 12px;background:#FFFDF5;border:1px solid #FDE68A;border-radius:6px;font-size:13.5px;color:#451A03;margin-bottom:10px;">
                            <strong>📝 Ghi chú ý tưởng của học viên:</strong> ${escapeHtml(sub.ideaNote)}
                          </div>
                        `
                          : ""
                      }

                      <div style="margin-bottom:10px;">
                        ${
                          sub.audioUrl
                            ? `<audio controls preload="none" src="${sub.audioUrl}" class="student-audio-player"></audio>`
                            : `<div style="font-size:12.5px;color:#71717A;margin-bottom:6px;"><em>(Không có tệp âm thanh đính kèm)</em></div>`
                        }
                        <div class="transcript-result-box">
                          <div class="transcript-box-header">
                            <span class="transcript-box-label">
                              Transcript bài nói (Bản #${sub.takeNum} · ${formatDuration(sub.durationSec)} · Tổng ${sub.totalAttemptsCount} lần ghi)
                            </span>
                          </div>
                          <p class="transcript-text-content">
                            ${sub.transcript ? `“${escapeHtml(sub.transcript)}”` : "<em>(Không có transcript văn bản)</em>"}
                          </p>
                        </div>
                      </div>

                      <div class="grade-row">
                        <input
                          type="text"
                          class="form-input"
                          style="height:36px;font-size:13px;width:130px;font-weight:700;"
                          placeholder="Điểm (VD: B1+)"
                          value="${escapeHtml(sub.teacherScore)}"
                          id="inp-score-${escapeHtml(sub.attemptId)}"
                        />
                        <input
                          type="text"
                          class="form-input"
                          style="height:36px;font-size:13px;flex:1;min-width:220px;"
                          placeholder="Nhận xét chấm bài của Giáo viên (học viên sẽ thấy ở bài đã nộp)..."
                          value="${escapeHtml(sub.teacherFeedback)}"
                          id="inp-fb-${escapeHtml(sub.attemptId)}"
                        />
                        <button
                          type="button"
                          class="save-grade-btn"
                          data-save-grade="${escapeHtml(sub.attemptId)}"
                          data-grade-email="${escapeHtml(sub.studentEmail)}"
                          data-grade-qid="${escapeHtml(sub.qId)}"
                        >
                          ${tState.savedToastId === sub.attemptId ? "✓ Đã lưu!" : "Lưu nhận xét"}
                        </button>
                      </div>
                    </div>
                  `
                  )
                  .join("")
          }
        `;
      }

      function renderTeacherApp() {
        const root = document.getElementById("teacher-app");
        if (!root) return;
        if (tState.unauthorizedEmail) {
          root.innerHTML = renderUnauthorizedView();
        } else if (tState.authenticated) {
          root.innerHTML = renderTeacherDashboard();
        } else {
          root.innerHTML = renderTeacherLogin();
        }
        bindTeacherEvents();
      }

      function bindTeacherEvents() {
        // Cloud Google Sign-In
        const btnGoogle = document.getElementById("btn-teacher-google-login");
        if (btnGoogle) {
          btnGoogle.onclick = async () => {
            tState.loading = true;
            tState.authError = "";
            renderTeacherApp();
            const { error } = await CLOUD.signInWithGoogle();
            if (error) {
              tState.loading = false;
              tState.authError = "Lỗi đăng nhập Google: " + error.message;
              renderTeacherApp();
            }
          };
        }

        // Cloud Email Sign-In
        const cloudEmailForm = document.getElementById("teacher-cloud-email-form");
        if (cloudEmailForm) {
          cloudEmailForm.onsubmit = async e => {
            e.preventDefault();
            const email = (document.getElementById("inp-teacher-email").value || "").trim().toLowerCase();
            const password = (document.getElementById("inp-teacher-pass").value || "").trim();
            const client = CLOUD.getClient();
            tState.loading = true;
            tState.authError = "";
            renderTeacherApp();
            const { data, error } = await client.auth.signInWithPassword({ email, password });
            if (error || !data || !data.user) {
              tState.loading = false;
              tState.authError = "Email hoặc mật khẩu chưa đúng.";
              renderTeacherApp();
              return;
            }
            await verifyAndLoadCloudTeacher(data.user);
          };
        }

        // Local Login Form
        const localLoginForm = document.getElementById("teacher-local-login-form");
        if (localLoginForm) {
          localLoginForm.onsubmit = async e => {
            e.preventDefault();
            const key = (document.getElementById("inp-teacher-key").value || "").trim();
            const res = await fetchLocalTeacherDb(key);
            if (res.ok) {
              tState.authenticated = true;
              tState.teacherKey = key;
              tState.authError = "";
              sessionStorage.setItem(TEACHER_SESSION_KEY, key);
              hydrateLocalDb(res.data);
              renderTeacherApp();
            } else {
              tState.authError = res.error || "Mật khẩu không đúng.";
              renderTeacherApp();
            }
          };
        }

        // Logout
        const btnLogout = document.getElementById("btn-teacher-logout");
        if (btnLogout) {
          btnLogout.onclick = async () => {
            if (isCloudMode()) {
              const client = CLOUD.getClient();
              try {
                await client.auth.signOut();
              } catch (e) {}
            }
            tState.authenticated = false;
            tState.unauthorizedEmail = "";
            tState.teacherEmail = "";
            tState.teacherKey = "";
            sessionStorage.removeItem(TEACHER_SESSION_KEY);
            renderTeacherApp();
          };
        }

        // Refresh
        const btnRefresh = document.getElementById("btn-refresh-data");
        if (btnRefresh) {
          btnRefresh.onclick = async () => {
            if (isCloudMode()) {
              await refreshCloudDashboardData();
            } else {
              const res = await fetchLocalTeacherDb(tState.teacherKey);
              if (res.ok) {
                hydrateLocalDb(res.data);
                renderTeacherApp();
              }
            }
          };
        }

        // Export CSV
        const btnExportCsv = document.getElementById("btn-export-csv");
        if (btnExportCsv) {
          btnExportCsv.onclick = () => {
            exportCsvReport(getFilteredSubmissions());
          };
        }

        // Tabs
        document.querySelectorAll("[data-teacher-tab]").forEach(btn => {
          btn.onclick = () => {
            tState.activeTab = btn.getAttribute("data-teacher-tab");
            renderTeacherApp();
          };
        });

        // Jump from Student row to Student's submissions
        document.querySelectorAll("[data-view-student-subs]").forEach(btn => {
          btn.onclick = () => {
            tState.filterStudent = btn.getAttribute("data-view-student-subs");
            tState.activeTab = "submissions";
            renderTeacherApp();
          };
        });

        // Filters
        const selStudent = document.getElementById("sel-filter-student");
        if (selStudent) {
          selStudent.onchange = e => {
            tState.filterStudent = e.target.value;
            renderTeacherApp();
          };
        }
        const selTopic = document.getElementById("sel-filter-topic");
        if (selTopic) {
          selTopic.onchange = e => {
            tState.filterTopic = e.target.value;
            renderTeacherApp();
          };
        }
        const selStatus = document.getElementById("sel-filter-status");
        if (selStatus) {
          selStatus.onchange = e => {
            tState.filterStatus = e.target.value;
            renderTeacherApp();
          };
        }

        // Save Teacher Grade / Feedback
        document.querySelectorAll("[data-save-grade]").forEach(btn => {
          btn.onclick = async () => {
            const attemptId = btn.getAttribute("data-save-grade");
            const scoreInp = document.getElementById("inp-score-" + attemptId);
            const fbInp = document.getElementById("inp-fb-" + attemptId);
            const scoreVal = scoreInp ? scoreInp.value.trim() : "";
            const fbVal = fbInp ? fbInp.value.trim() : "";

            if (isCloudMode()) {
              await saveCloudGrade(attemptId, scoreVal, fbVal);
            } else {
              const email = btn.getAttribute("data-grade-email");
              const qId = btn.getAttribute("data-grade-qid");
              if (
                tState.rawLocalDb.accounts[email] &&
                tState.rawLocalDb.accounts[email].questionsData &&
                tState.rawLocalDb.accounts[email].questionsData[qId]
              ) {
                tState.rawLocalDb.accounts[email].questionsData[qId].teacherScore = scoreVal;
                tState.rawLocalDb.accounts[email].questionsData[qId].teacherFeedback = fbVal;
                await saveLocalTeacherDb();
                hydrateLocalDb(tState.rawLocalDb);
                tState.savedToastId = attemptId;
                renderTeacherApp();
              }
            }
          };
        });
      }

      // Bootstrap
      window.addEventListener("DOMContentLoaded", async () => {
        if (isCloudMode()) {
          const client = CLOUD.getClient();
          renderTeacherApp();

          const { data } = await client.auth.getSession();
          if (data && data.session && data.session.user) {
            await verifyAndLoadCloudTeacher(data.session.user);
          }

          client.auth.onAuthStateChange(async (event, session) => {
            if (event === "SIGNED_IN" && session && session.user && !tState.authenticated && !tState.unauthorizedEmail) {
              await verifyAndLoadCloudTeacher(session.user);
            } else if (event === "SIGNED_OUT") {
              tState.authenticated = false;
              tState.unauthorizedEmail = "";
              tState.teacherEmail = "";
              renderTeacherApp();
            }
          });
          return;
        }

        // Local fallback bootstrap
        if (tState.teacherKey) {
          const res = await fetchLocalTeacherDb(tState.teacherKey);
          if (res.ok) {
            tState.authenticated = true;
            hydrateLocalDb(res.data);
          }
        }
        renderTeacherApp();
      });
    })();
  </script>
</body>
</html>
