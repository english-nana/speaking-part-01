<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Trang Giáo Viên — Quản lý Học viên (VSTEP Speaking)</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

<body>
  <div id="teacher-app"></div>
  <script src="./supabase-config.js?v=20261124j"></script>
  <script src="./supabase-client.js?v=20261124j"></script>
  <script src="./travel-data.js?v=20261124j"></script>
  <script src="./speaking-evaluator.js?v=20261124j"></script>
  <script>
    (function () {
      const TOPICS = window.SPEAKING_TOPICS || [];
      const CLOUD = window.SpeakingCloud;
      const escapeHtml = CLOUD.escapeHtml;
      const formatDuration = CLOUD.formatDuration;
      const RELEASE_HOURS = CLOUD.RELEASE_DELAY_HOURS || 6;
      const ADMIN_EMAIL = "mtung0208@gmail.com";

      // Danh mục phần thi Speaking (hiện tại là Part 1, sẵn sàng mở rộng Part 2 & Part 3)
      const PARTS_CATALOG = [
        { id: "part1", label: "Part 1 · Social Interaction", shortLabel: "Part 1", ready: true },
        { id: "part2", label: "Part 2 · Solution Discussion (Sắp có)", shortLabel: "Part 2", ready: false },
        { id: "part3", label: "Part 3 · Topic Development (Sắp có)", shortLabel: "Part 3", ready: false }
      ];

      const LEVEL_FILTER_OPTIONS = [
        { value: "all", label: "Tất cả trình độ" },
        { value: "B1", label: "Mục tiêu B1" },
        { value: "B2", label: "Mục tiêu B2" }
      ];

      const tState = {
        loading: false,
        authenticated: false,
        unauthorizedEmail: "",
        teacherEmail: "",
        teacherUserId: "",
        accountMenuOpen: false,
        infoModalStudentId: "",
        selectedStudentId: "", // "" = danh sách học viên | "<uuid>" = xem bài làm của học viên đó
        deletingUserId: "",
        gradingAttemptId: "",
        releasingAttemptId: "",
        flushingQueue: false,
        authError: "",
        dbError: "",
        aiTableNotice: "",
        students: [],
        submissions: [],
        filterClass: "all", // "all" | "ONB204" | "CB221" | "unassigned"
        filterLevel: "all", // "all" | "B1" | "B2"
        filterPart: "all", // "all" | "part1" | "part2" | "part3"
        filterTopic: "all",
        filterStatus: "all", // "all" | "submitted" | "unread_review" | "ungraded" | "graded"
        savedToastId: ""
      };

      function isHiddenAdminAccount(email, rawName) {
        const lowerEmail = String(email || "").trim().toLowerCase();
        const lowerName = String(rawName || "").trim().toLowerCase();
        return (
          lowerEmail === "mtung0208@gmail.com" ||
          lowerEmail.startsWith("mtung0208@") ||
          lowerName === "mtung0208"
        );
      }

      function getTeacherDisplayName(email) {
        const lower = String(email || "").trim().toLowerCase();
        if (lower === "mtung0208@gmail.com" || lower.startsWith("mtung0208@")) {
          return "admin";
        }
        return email ? email.split("@")[0] : "admin";
      }

      function getTopicPartId(topicObj) {
        return (topicObj && topicObj.part) || "part1";
      }

      function getPartShortLabel(partId) {
        const found = PARTS_CATALOG.find(p => p.id === partId);
        return found ? found.shortLabel : "Part 1";
      }

      function buildQuestionMetaMap() {
        const map = {};
        TOPICS.forEach(t => {
          const partId = getTopicPartId(t);
          (t.questions || []).forEach(q => {
            map[q.id] = {
              partId,
              topicId: t.id,
              topicTitle: t.title,
              prompt: q.prompt,
              num: q.num,
              questionObj: q
            };
          });
        });
        return map;
      }

      function speakEnglishText(rawText) {
        const cleanText = String(rawText || "").replace(/<[^>]*>?/gm, "").trim();
        if (!cleanText) return;
        if ("speechSynthesis" in window) {
          try {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = "en-US";
            utter.rate = 0.92;
            window.speechSynthesis.speak(utter);
            return;
          } catch (e) {}
        }
      }

      // ======================================================================
      // CLOUD DATA LOADER (SUPABASE + SERVER-SIDE RLS VERIFICATION)
      // ======================================================================
      async function verifyAndLoadCloudTeacher(user) {
        const client = CLOUD.getClient();
        if (!client || !user) {
          window.location.replace("./index.html");
          return;
        }

        const userEmail = String(user.email || "").trim().toLowerCase();
        if (userEmail !== ADMIN_EMAIL) {
          window.location.replace("./index.html");
          return;
        }

        tState.loading = true;
        tState.authError = "";
        tState.unauthorizedEmail = "";
        renderTeacherApp();

        const { data: isTeacherFlag, error: rpcError } = await client.rpc("is_teacher");
        if (rpcError || !isTeacherFlag) {
          window.location.replace("./index.html");
          return;
        }

        tState.authenticated = true;
        tState.teacherEmail = user.email || "";
        tState.teacherUserId = user.id || "";
        await refreshCloudDashboardData();
      }

      async function refreshCloudDashboardData() {
        const client = CLOUD.getClient();
        if (!client) return;

        tState.loading = true;
        tState.dbError = "";
        tState.aiTableNotice = "";
        renderTeacherApp();

        const [profilesRes, vocabRes, attemptsRes, reviewsRes] = await Promise.all([
          client.from("profiles").select("*").order("last_active_at", { ascending: false }),
          client.from("student_vocab").select("user_id, word, meaning, topic").order("created_at", { ascending: false }),
          client.from("speaking_attempts").select("*").order("created_at", { ascending: false }),
          client.from("speaking_ai_reviews").select("*")
        ]);

        const firstErr = profilesRes.error || attemptsRes.error || vocabRes.error;
        if (firstErr) {
          tState.dbError =
            "Không thể đọc dữ liệu từ Supabase (" +
            (firstErr.code ? firstErr.code + ": " : "") +
            firstErr.message +
            "). Vui lòng kiểm tra đã chạy đủ lệnh GRANT trong SQL Editor chưa.";
        }

        if (reviewsRes.error) {
          tState.aiTableNotice =
            "Chưa thấy bảng speaking_ai_reviews trên Supabase — hãy chạy file supabase-setup.sql mới nhất và deploy Edge Function grade-speaking để bật chấm tự động trả sau 6 tiếng.";
        }

        const rawProfiles = Array.isArray(profilesRes.data) ? profilesRes.data : [];
        const vocabRows = Array.isArray(vocabRes.data) ? vocabRes.data : [];
        const attemptRows = Array.isArray(attemptsRes.data) ? attemptsRes.data : [];
        const reviewRows = Array.isArray(reviewsRes.data) ? reviewsRes.data : [];

        // Loại bỏ tài khoản admin (mtung0208) khỏi danh sách học viên & thống kê
        const hiddenAdminIds = new Set();
        rawProfiles.forEach(p => {
          if (isHiddenAdminAccount(p.email, p.full_name)) {
            hiddenAdminIds.add(p.id);
          }
        });
        const profiles = rawProfiles.filter(p => !hiddenAdminIds.has(p.id));

        const reviewByKey = {};
        const reviewByAttemptId = {};
        reviewRows.forEach(r => {
          if (r && r.id) reviewByKey[r.id] = r;
          if (r && r.attempt_id) reviewByAttemptId[r.attempt_id] = r;
        });

        const vocabListByUser = {};
        vocabRows.forEach(v => {
          if (!v || !v.user_id || hiddenAdminIds.has(v.user_id)) return;
          if (!vocabListByUser[v.user_id]) vocabListByUser[v.user_id] = [];
          vocabListByUser[v.user_id].push({
            word: v.word || "",
            meaning: v.meaning || "",
            topic: v.topic || ""
          });
        });

        const profileById = {};
        const parsedById = {};
        profiles.forEach(p => {
          profileById[p.id] = p;
          parsedById[p.id] = CLOUD.parseFullNameAndClass(p.full_name || "");
        });

        // Chỉ ghi nhận bài đã nộp chính thức (bỏ qua bản ghi nháp chưa nộp)
        const studentAttemptRows = attemptRows.filter(
          a => Boolean(a.is_submitted) && !hiddenAdminIds.has(a.user_id)
        );
        const signedUrlMap = await CLOUD.getSignedAudioUrls(
          studentAttemptRows.map(a => a.audio_path).filter(Boolean)
        );

        const grouped = {};
        studentAttemptRows.forEach(att => {
          const k = `${att.user_id}__${att.question_id}`;
          if (!grouped[k]) grouped[k] = [];
          grouped[k].push(att);
        });

        const qMetaMap = buildQuestionMetaMap();
        const nowMs = Date.now();
        const submissions = [];

        Object.keys(grouped).forEach(k => {
          const list = grouped[k];
          const chosen = list.find(a => a.is_submitted);
          if (!chosen) return;
          const prof = profileById[chosen.user_id] || {
            id: chosen.user_id,
            full_name: "Học viên",
            email: ""
          };
          if (isHiddenAdminAccount(prof.email, prof.full_name)) return;

          const parsedProf = parsedById[chosen.user_id] || CLOUD.parseFullNameAndClass(prof.full_name || "");
          const qMeta = qMetaMap[chosen.question_id] || {
            partId: "part1",
            topicId: chosen.topic_id || "other",
            topicTitle: chosen.topic_title || chosen.topic_id || "Chủ đề",
            prompt: chosen.prompt_text || chosen.question_id,
            num: 1
          };

          const matchedReview = reviewByAttemptId[chosen.id] || reviewByKey[k] || null;
          const activeAiReview =
            matchedReview && (!matchedReview.attempt_id || matchedReview.attempt_id === chosen.id)
              ? matchedReview
              : null;

          const rj = activeAiReview && activeAiReview.review_json ? activeAiReview.review_json : null;
          const evaluatedBand =
            rj && typeof CLOUD.formatCleanBandLabel === "function"
              ? CLOUD.formatCleanBandLabel(rj.estimated_band, rj.level_assessment, rj.internal_score)
              : "";
          const hasReadyReview = Boolean(activeAiReview && activeAiReview.status === "ready" && rj);
          const relMs = activeAiReview && activeAiReview.release_at ? new Date(activeAiReview.release_at).getTime() : 0;
          const isReviewReleased = hasReadyReview && relMs > 0 && relMs <= nowMs;
          const isReviewSeen = isReviewReleased && Boolean(activeAiReview.student_seen_at);

          submissions.push({
            attemptId: chosen.id,
            reviewKey: k,
            studentId: chosen.user_id,
            studentName: parsedProf.fullName || prof.email || "Học viên",
            studentClass: parsedProf.className || "",
            studentEmail: prof.email || "",
            partId: qMeta.partId || "part1",
            partLabel: getPartShortLabel(qMeta.partId || "part1"),
            qId: chosen.question_id,
            topicId: qMeta.topicId,
            topicTitle: qMeta.topicTitle,
            questionNum: qMeta.num,
            prompt: qMeta.prompt,
            targetLevel: String(chosen.target_level || (activeAiReview && activeAiReview.target_level) || "B1").toUpperCase(),
            evaluatedBand,
            isOfficiallySubmitted: Boolean(chosen.is_submitted),
            isReviewReleased,
            isReviewSeen,
            submittedAt: CLOUD.formatDateTime(chosen.submitted_at || chosen.created_at),
            rawTime: new Date(chosen.submitted_at || chosen.created_at || 0).getTime(),
            durationSec: chosen.duration_sec || 0,
            takeNum: chosen.take_number || 1,
            totalAttemptsCount: list.length,
            audioUrl: chosen.audio_path ? signedUrlMap[chosen.audio_path] || "" : "",
            transcript: chosen.transcript || (rj && rj.recognized_transcript) || "",
            teacherFeedback: chosen.teacher_feedback || "",
            teacherScore: chosen.teacher_score || "",
            aiStatus: chosen.ai_status || "",
            aiReleaseAt: chosen.ai_release_at || "",
            aiReview: activeAiReview
          });
        });

        submissions.sort((a, b) => {
          if (a.isOfficiallySubmitted !== b.isOfficiallySubmitted) {
            return a.isOfficiallySubmitted ? -1 : 1;
          }
          return (b.rawTime || 0) - (a.rawTime || 0);
        });

        tState.students = profiles.map(p => {
          const parsedProf = parsedById[p.id] || CLOUD.parseFullNameAndClass(p.full_name || "");
          const vocabItems = vocabListByUser[p.id] || [];
          return {
            id: p.id,
            name: parsedProf.fullName || p.email,
            className: parsedProf.className || "",
            email: p.email,
            createdAt: CLOUD.formatDateTime(p.created_at),
            lastActiveAt: CLOUD.formatDateTime(p.last_active_at),
            vocabCount: vocabItems.length,
            vocabItems
          };
        });

        tState.submissions = submissions;
        if (tState.selectedStudentId && !tState.students.some(s => s.id === tState.selectedStudentId)) {
          tState.selectedStudentId = "";
        }
        if (tState.infoModalStudentId && !tState.students.some(s => s.id === tState.infoModalStudentId)) {
          tState.infoModalStudentId = "";
        }
        tState.loading = false;
        renderTeacherApp();
      }

      async function saveCloudGrade(attemptId, scoreVal, feedbackVal) {
        const client = CLOUD.getClient();
        if (!client) return;
        const { error } = await client
          .from("speaking_attempts")
          .update({
            teacher_score: scoreVal,
            teacher_feedback: feedbackVal
          })
          .eq("id", attemptId);
        if (!error) {
          const item = tState.submissions.find(s => s.attemptId === attemptId);
          if (item) {
            item.teacherScore = scoreVal;
            item.teacherFeedback = feedbackVal;
          }
          tState.savedToastId = attemptId;
          renderTeacherApp();
          setTimeout(() => {
            if (tState.savedToastId === attemptId) {
              tState.savedToastId = "";
              renderTeacherApp();
            }
          }, 2200);
        } else {
          alert("Lỗi lưu nhận xét: " + error.message);
        }
      }

      async function triggerTeacherAiGrade(attemptId) {
        if (!attemptId || tState.gradingAttemptId) return;
        const subObj = tState.submissions.find(s => s.attemptId === attemptId);
        tState.gradingAttemptId = attemptId;
        renderTeacherApp();

        const res = await CLOUD.invokeGradeSpeaking(attemptId, {
          forceTeacher: true,
          releaseNow: false,
          promptText: subObj ? subObj.prompt : "",
          topicTitle: subObj ? subObj.topicTitle : "",
          targetLevel: subObj ? subObj.targetLevel : "B1"
        });
        tState.gradingAttemptId = "";
        if (!res.ok) {
          renderTeacherApp();
          alert(
            "Không chạy được chấm bài: " +
              (res.error ||
                "Vui lòng kiểm tra đã deploy Edge Function grade-speaking và cài GEMINI_API_KEY chưa.")
          );
          return;
        }
        await refreshCloudDashboardData();
      }

      async function releaseAiReviewNow(attemptId) {
        const client = CLOUD.getClient();
        if (!client || !attemptId || tState.releasingAttemptId) return;
        tState.releasingAttemptId = attemptId;
        renderTeacherApp();

        const { error } = await client.rpc("teacher_release_speaking_review_now", {
          p_attempt_id: attemptId
        });
        tState.releasingAttemptId = "";
        if (error) {
          renderTeacherApp();
          alert("Không trả bài sớm được: " + error.message);
          return;
        }
        await refreshCloudDashboardData();
      }

      async function flushPendingQueueNow() {
        if (tState.flushingQueue) return;
        tState.flushingQueue = true;
        renderTeacherApp();
        const res = await CLOUD.invokeProcessSpeakingQueue(5);
        tState.flushingQueue = false;
        if (!res.ok) {
          renderTeacherApp();
          alert("Không chạy được hàng đợi chấm bài: " + (res.error || "Lỗi không xác định"));
          return;
        }
        await refreshCloudDashboardData();
        alert(
          `Đã xử lý ${res.processed || 0} bài nói chờ: thành công ${res.succeeded || 0} bài, còn chờ thử lại ${res.failed || 0} bài.`
        );
      }

      async function deleteStudentAccount(studentId, studentName, studentEmail) {
        const client = CLOUD.getClient();
        if (!client || !studentId || tState.deletingUserId) return;
        if (studentId === tState.teacherUserId) {
          alert("Không thể tự xoá tài khoản đang đăng nhập.");
          return;
        }
        const label = studentName ? `${studentName} (${studentEmail || ""})` : studentEmail || studentId;
        if (
          !confirm(
            `Bạn có chắc muốn XOÁ VĨNH VIỄN tài khoản "${label}"?\n\nToàn bộ bài nộp, bản ghi âm và từ vựng của tài khoản này sẽ bị xoá khỏi hệ thống.`
          )
        ) {
          return;
        }

        tState.deletingUserId = studentId;
        renderTeacherApp();

        try {
          const { data: attRows } = await client
            .from("speaking_attempts")
            .select("audio_path")
            .eq("user_id", studentId);
          const audioPaths = Array.isArray(attRows) ? attRows.map(r => r.audio_path).filter(Boolean) : [];
          if (audioPaths.length > 0) {
            await CLOUD.deleteRecordings(audioPaths);
          }

          const { error } = await client.rpc("teacher_delete_student", { target_user_id: studentId });
          if (error) {
            tState.deletingUserId = "";
            renderTeacherApp();
            alert(
              "Không xoá được tài khoản: " +
                error.message +
                "\n\nLưu ý: Bạn cần chạy lại file supabase-setup.sql mới nhất trong Supabase SQL Editor để kích hoạt hàm teacher_delete_student."
            );
            return;
          }

          if (tState.selectedStudentId === studentId) {
            tState.selectedStudentId = "";
          }
          tState.infoModalStudentId = "";
          tState.deletingUserId = "";
          await refreshCloudDashboardData();
        } catch (err) {
          tState.deletingUserId = "";
          renderTeacherApp();
          alert("Lỗi khi xoá tài khoản: " + (err && err.message ? err.message : "Không xác định"));
        }
      }

      // ======================================================================
      // FILTERING LOGIC (HỌ TÊN, LỚP, TRÌNH ĐỘ, PHẦN, CHỦ ĐỀ)
      // ======================================================================
      function matchesClassFilter(clsName) {
        if (tState.filterClass === "all") return true;
        if (tState.filterClass === "unassigned") return !clsName;
        return clsName === tState.filterClass;
      }

      function matchesPartFilter(partId) {
        if (tState.filterPart === "all") return true;
        return (partId || "part1") === tState.filterPart;
      }

      function matchesTopicFilter(topicId) {
        if (tState.filterTopic === "all") return true;
        return topicId === tState.filterTopic;
      }

      function matchesLevelFilter(sub) {
        if (tState.filterLevel === "all") return true;
        return (sub.targetLevel || "B1").toUpperCase() === tState.filterLevel;
      }

      function hasAnyFeedbackOrReview(sub) {
        if (!sub) return false;
        const hasManual = Boolean(
          (sub.teacherFeedback && sub.teacherFeedback.trim()) ||
            (sub.teacherScore && sub.teacherScore.trim())
        );
        const hasReadyAi = Boolean(
          sub.aiReview && sub.aiReview.status === "ready" && sub.aiReview.review_json
        );
        return hasManual || hasReadyAi;
      }

      function getVisibleTopicsForPart() {
        if (tState.filterPart === "all") return TOPICS;
        return TOPICS.filter(t => getTopicPartId(t) === tState.filterPart);
      }

      function getQuestionsTotalForScope() {
        if (tState.filterTopic !== "all") {
          const found = TOPICS.find(t => t.id === tState.filterTopic);
          return found ? (found.questions || []).length : 0;
        }
        return getVisibleTopicsForPart().reduce((acc, t) => acc + (t.questions || []).length, 0);
      }

      function getStudentScopedMetrics(studentId) {
        const userSubs = tState.submissions.filter(sub => {
          if (sub.studentId !== studentId) return false;
          if (!matchesPartFilter(sub.partId)) return false;
          if (!matchesTopicFilter(sub.topicId)) return false;
          if (!matchesLevelFilter(sub)) return false;
          return true;
        });

        const submittedSubs = userSubs.filter(s => s.isOfficiallySubmitted);
        const releasedCount = submittedSubs.filter(s => s.isReviewReleased).length;
        const seenCount = submittedSubs.filter(s => s.isReviewSeen).length;
        const pendingCount = submittedSubs.filter(s => !s.isReviewReleased).length;

        return {
          matchedTotal: userSubs.length,
          submittedCount: submittedSubs.length,
          releasedCount,
          seenCount,
          pendingCount
        };
      }

      function getFilteredStudents() {
        const hasContentFilter =
          tState.filterLevel !== "all" ||
          tState.filterTopic !== "all" ||
          (tState.filterPart !== "all" && tState.filterPart !== "part1");

        return tState.students
          .filter(st => matchesClassFilter(st.className))
          .map(st => ({
            ...st,
            metrics: getStudentScopedMetrics(st.id)
          }))
          .filter(st => (!hasContentFilter ? true : st.metrics.matchedTotal > 0));
      }

      function getFilteredSubmissionsForStudent(studentId) {
        return tState.submissions.filter(sub => {
          if (studentId && sub.studentId !== studentId) return false;
          if (!matchesClassFilter(sub.studentClass)) return false;
          if (!matchesPartFilter(sub.partId)) return false;
          if (!matchesTopicFilter(sub.topicId)) return false;
          if (!matchesLevelFilter(sub)) return false;
          if (tState.filterStatus === "submitted" && !sub.isOfficiallySubmitted) return false;
          if (tState.filterStatus === "unread_review" && (!sub.isReviewReleased || sub.isReviewSeen)) return false;
          if (tState.filterStatus === "ungraded" && hasAnyFeedbackOrReview(sub)) return false;
          if (tState.filterStatus === "graded" && !hasAnyFeedbackOrReview(sub)) return false;
          return true;
        });
      }

      function hasActiveFilters() {
        return (
          tState.filterClass !== "all" ||
          tState.filterLevel !== "all" ||
          tState.filterPart !== "all" ||
          tState.filterTopic !== "all" ||
          tState.filterStatus !== "all"
        );
      }

      // ======================================================================
      // EXPORT CSV (EXCEL-READY WITH UTF-8 BOM)
      // ======================================================================
      function exportCsvReport(rows) {
        const csvCell = v => `"${String(v || "").replace(/"/g, '""')}"`;
        const header = [
          "Học viên",
          "Lớp",
          "Email",
          "Phần thi",
          "Chủ đề",
          "Câu hỏi",
          "Mục tiêu Level",
          "Đánh giá mức",
          "Đã đọc bài sửa",
          "Trạng thái nộp",
          "Thời gian nộp",
          "Thời lượng (giây)",
          "Transcript bài nói",
          "Đánh giá của GV",
          "Nhận xét giáo viên"
        ];
        const lines = [header.map(csvCell).join(",")];
        rows.forEach(sub => {
          const readLabel = !sub.isOfficiallySubmitted
            ? "—"
            : sub.isReviewReleased
              ? sub.isReviewSeen
                ? "Đã đọc"
                : "Chưa đọc"
              : "Chờ trả bài";
          lines.push(
            [
              sub.studentName,
              sub.studentClass || "—",
              sub.studentEmail,
              sub.partLabel,
              sub.topicTitle,
              `Q${sub.questionNum}: ${sub.prompt}`,
              sub.targetLevel || "B1",
              sub.evaluatedBand || "",
              readLabel,
              sub.isOfficiallySubmitted ? "Đã nộp chính thức" : "Bản nháp",
              sub.submittedAt,
              sub.durationSec,
              sub.transcript,
              sub.teacherScore,
              sub.teacherFeedback
            ]
              .map(csvCell)
              .join(",")
          );
        });
        const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `bao-cao-vstep-speaking-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function renderReadReviewBadge(metrics) {
        if (!metrics || (metrics.releasedCount === 0 && metrics.pendingCount === 0)) {
          return `<span class="review-read-pill neutral">Chưa có bài sửa</span>`;
        }
        if (metrics.releasedCount === 0 && metrics.pendingCount > 0) {
          return `<span class="review-read-pill waiting">⏳ Chờ trả (${metrics.pendingCount})</span>`;
        }
        if (metrics.seenCount === metrics.releasedCount) {
          return `<span class="review-read-pill read">✓ Đã đọc (${metrics.seenCount}/${metrics.releasedCount})</span>`;
        }
        if (metrics.seenCount === 0) {
          return `<span class="review-read-pill unread">● Chưa đọc (0/${metrics.releasedCount})</span>`;
        }
        return `<span class="review-read-pill partial">Đã đọc ${metrics.seenCount}/${metrics.releasedCount}</span>`;

                    const isWaitingRelease = hasReadyReview && relMs > Date.now();
                    const remain = isWaitingRelease ? CLOUD.formatRemainingTime(rev.release_at) : "";
                    const rj = hasReadyReview ? rev.review_json : null;
                    const totalFixCount = rj
                      ? (Array.isArray(rj.pronunciation_fixes) ? rj.pronunciation_fixes.length : 0) +
                        (Array.isArray(rj.language_corrections) ? rj.language_corrections.length : 0) +
                        (Array.isArray(rj.idea_expansions) ? rj.idea_expansions.length : 0)
                      : 0;

                    let statusHtml = `<span style="font-size:12.5px;color:#52525B;">Chưa có bài sửa chi tiết.</span>`;
                    if (hasReadyReview && isWaitingRelease) {
                      statusHtml = `<span style="font-size:12.5px;font-weight:700;color:#92400E;">⏳ Đã chấm xong · Hẹn trả lúc ${escapeHtml(CLOUD.formatDateTime(rev.release_at))} (còn ${escapeHtml(remain)})</span>`;

                              ? `<audio controls preload="none" src="${sub.audioUrl}" class="student-audio-player"></audio>`
                              : `<div style="font-size:12.5px;color:#71717A;margin-bottom:6px;"><em>(Không có tệp âm thanh đính kèm)</em></div>`

                          <div class="transcript-result-box">
                            <div class="transcript-box-header">
                              <span class="transcript-box-label">

                        <div class="teacher-ai-bar">

                          <div class="teacher-ai-actions">

                            <button type="button" class="top-pill-btn" data-ai-grade="${escapeHtml(sub.attemptId)}" ${isGrading ? "disabled" : ""}>

                            </button>
                          </div>
                        </div>

                        ${
                          hasReadyReview
                            ? `
                              <details class="teacher-ai-details">
                                <summary>
                                  📝 Xem chi tiết bài sửa (${totalFixCount} mục góp ý · Level ${escapeHtml(rev.target_level || sub.targetLevel)}${sub.evaluatedBand ? ` · ${escapeHtml(sub.evaluatedBand)}` : ""})

                                })}
                              </details>
                            `
                            : ""
                        }

                        <div class="grade-row">
                          <input
                            type="text"
                            class="form-input grade-score-input"
                            placeholder="Mức đạt (VD: Xấp xỉ B2)"
                            value="${escapeHtml(sub.teacherScore)}"
                            id="inp-score-${escapeHtml(sub.attemptId)}"
                          />
                          <input
                            type="text"
                            class="form-input grade-fb-input"
                            placeholder="Nhận xét thêm của Giáo viên..."
                            value="${escapeHtml(sub.teacherFeedback)}"
                            id="inp-fb-${escapeHtml(sub.attemptId)}"
                          />
                          <button

        `;

      function renderTeacherDashboard() {
        const totalSubmitted = tState.submissions.filter(s => s.isOfficiallySubmitted).length;
        const totalUngraded = tState.submissions.filter(
          s => s.isOfficiallySubmitted && !hasAnyFeedbackOrReview(s)
        ).length;
        const pendingAiCount = tState.submissions.filter(
          s => s.isOfficiallySubmitted && (!s.aiReview || s.aiReview.status !== "ready")
        ).length;

        const selectedStudentObj = tState.selectedStudentId
          ? tState.students.find(s => s.id === tState.selectedStudentId)
          : null;

        return `
          <div class="home-shell">
            <header class="dt-topbar teacher-clean-topbar">
              <div class="dt-topbar-inner">
                <div class="dt-topbar-left-group">
                  <button
                    type="button"
                    class="ej-sb-logo-btn"
                    id="btn-brand-reset-view"
                    title="Về danh sách học viên"
                  >
                    <span class="ej-sb-logo-badge">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </span>
                    <div class="ej-sb-logo-text">
                      <span class="ej-sb-logo-main">Quản lý Học viên</span>
                      <span class="ej-sb-logo-sub">VSTEP Speaking</span>
                    </div>
                  </button>
                </div>

                <div class="dt-topbar-right-group teacher-topbar-right">
                  <a href="./index.html?view=student" class="top-pill-btn" style="text-decoration:none;" title="Xem giao diện luyện tập của học viên">
                    <span>← <span class="topbar-vocab-label-full">Trang học</span></span>
                  </a>

                  ${
                    pendingAiCount > 0 && !tState.aiTableNotice
                      ? `<button type="button" class="top-pill-btn yellow" id="btn-flush-queue" ${tState.flushingQueue ? "disabled" : ""}>
                          <span>${tState.flushingQueue ? "⏳..." : `🔄 Chấm chờ (${pendingAiCount})`}</span>
                        </button>`
                      : ""
                  }

                  <button type="button" class="top-pill-btn" id="btn-refresh-data" title="Làm mới dữ liệu">
                    <span>${tState.loading ? "⏳" : "↻"} <span class="topbar-vocab-label-full">Làm mới</span></span>
                  </button>

                  <button type="button" class="top-pill-btn yellow" id="btn-export-csv" title="Xuất báo cáo Excel (.csv)">
                    <span>📊 <span class="topbar-vocab-label-full">Xuất Excel</span></span>
                  </button>

                  ${renderAccountMenuHtml()}
                </div>
              </div>
            </header>

            <main class="home-container teacher-compact-container">
              ${
                tState.dbError
                  ? `<div style="padding:12px 16px;border:2px solid #DC2626;background:#FEF2F2;color:#B91C1C;font-size:13.5px;font-weight:700;margin-bottom:16px;border-radius:8px;">⚠️ ${escapeHtml(tState.dbError)}</div>`
                  : ""
              }
              ${
                tState.aiTableNotice
                  ? `<div style="padding:12px 16px;border:2px solid #D97706;background:#FFFBEB;color:#92400E;font-size:13px;font-weight:600;margin-bottom:16px;border-radius:8px;">💡 ${escapeHtml(tState.aiTableNotice)}</div>`
                  : ""
              }

              <div class="teacher-stats-grid teacher-stats-3col">
                <div class="teacher-stat-card">
                  <div class="teacher-stat-label">Tổng số học viên</div>
                  <div class="teacher-stat-value">${tState.students.length}</div>
                </div>
                <div class="teacher-stat-card">
                  <div class="teacher-stat-label">Bài đã nộp chính thức</div>
                  <div class="teacher-stat-value" style="color:#15803D;">${totalSubmitted}</div>
                </div>
                <div class="teacher-stat-card">
                  <div class="teacher-stat-label">Bài chờ chấm / nhận xét</div>
                  <div class="teacher-stat-value" style="color:#B45309;">${totalUngraded}</div>
                </div>
              </div>

              ${
                selectedStudentObj
                  ? renderStudentSubmissionsSection(selectedStudentObj)
                  : renderStudentsTableSection()
              }
            </main>
          </div>
          ${renderStudentInfoModal()}
        `;
      }

      function renderTeacherApp() {
        const root = document.getElementById("teacher-app");
        if (!root) return;
        if (tState.authenticated) {
          root.innerHTML = renderTeacherDashboard();
        } else {
          root.innerHTML = renderCheckingAuthView();
        }
        bindTeacherEvents();
      }

      function bindTeacherEvents() {
        const btnToggleAcc = document.getElementById("btn-toggle-account-menu");
        if (btnToggleAcc) {
          btnToggleAcc.onclick = e => {
            e.stopPropagation();
            tState.accountMenuOpen = !tState.accountMenuOpen;
            renderTeacherApp();
          };
        }

        const btnLogout = document.getElementById("btn-teacher-logout");
        if (btnLogout) {
          btnLogout.onclick = async () => {
            tState.accountMenuOpen = false;
            const client = CLOUD.getClient();
            if (client) {
              try {
                await client.auth.signOut();
              } catch (e) {}
            }
            window.location.replace("./index.html");
          };
        }

        const btnBrandReset = document.getElementById("btn-brand-reset-view");
        if (btnBrandReset) {
          btnBrandReset.onclick = () => {
            tState.selectedStudentId = "";
            renderTeacherApp();
          };
        }

        const btnBackStudents = document.getElementById("btn-back-to-students");
        if (btnBackStudents) {
          btnBackStudents.onclick = () => {
            tState.selectedStudentId = "";
            tState.filterStatus = "all";
            renderTeacherApp();
          };
        }

        const btnRefresh = document.getElementById("btn-refresh-data");
        if (btnRefresh) {
          btnRefresh.onclick = () => refreshCloudDashboardData();
        }

        const btnFlushQueue = document.getElementById("btn-flush-queue");
        if (btnFlushQueue) {
          btnFlushQueue.onclick = () => flushPendingQueueNow();
        }

        const btnExportCsv = document.getElementById("btn-export-csv");
        if (btnExportCsv) {
          btnExportCsv.onclick = () =>
            exportCsvReport(getFilteredSubmissionsForStudent(tState.selectedStudentId || ""));
        }

        const btnResetFilters = document.getElementById("btn-reset-filters");
        if (btnResetFilters) {
          btnResetFilters.onclick = () => {
            tState.filterClass = "all";
            tState.filterLevel = "all";
            tState.filterPart = "all";
            tState.filterTopic = "all";
            tState.filterStatus = "all";
            renderTeacherApp();
          };
        }

        document.querySelectorAll("[data-open-student-info]").forEach(btn => {
          btn.onclick = e => {
            e.stopPropagation();
            tState.infoModalStudentId = btn.getAttribute("data-open-student-info") || "";
            renderTeacherApp();
          };
        });

        ["student-info-backdrop", "btn-close-student-info"].forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.onclick = () => {
              tState.infoModalStudentId = "";
              renderTeacherApp();
            };
          }
        });

        document.querySelectorAll("[data-view-student-subs]").forEach(btn => {
          btn.onclick = () => {
            tState.selectedStudentId = btn.getAttribute("data-view-student-subs") || "";
            renderTeacherApp();
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
        });

        document.querySelectorAll("[data-delete-student]").forEach(btn => {
          btn.onclick = () => {
            deleteStudentAccount(
              btn.getAttribute("data-delete-student"),
              btn.getAttribute("data-delete-student-name"),
              btn.getAttribute("data-delete-student-email")
            );
          };
        });

        const selFilterClass = document.getElementById("sel-filter-class");
        if (selFilterClass) {
          selFilterClass.onchange = e => {
            tState.filterClass = e.target.value;
            renderTeacherApp();
          };
        }

        const selFilterLevel = document.getElementById("sel-filter-level");
        if (selFilterLevel) {
          selFilterLevel.onchange = e => {
            tState.filterLevel = e.target.value;
            renderTeacherApp();
          };
        }

        const selFilterPart = document.getElementById("sel-filter-part");
        if (selFilterPart) {
          selFilterPart.onchange = e => {
            tState.filterPart = e.target.value;
            if (tState.filterTopic !== "all") {
              const stillValid = getVisibleTopicsForPart().some(t => t.id === tState.filterTopic);
              if (!stillValid) tState.filterTopic = "all";
            }
            renderTeacherApp();
          };
        }

        const selTopic = document.getElementById("sel-filter-topic");
        if (selTopic) {
          selTopic.onchange = e => {
            tState.filterTopic = e.target.value;
            renderTeacherApp();
          };
        }

        const selStatus = document.getElementById("sel-filter-status");
        if (selStatus) {
          selStatus.onchange = e => {
            tState.filterStatus = e.target.value;
            renderTeacherApp();
          };
        }

        document.querySelectorAll("[data-save-grade]").forEach(btn => {
          btn.onclick = async () => {
            const attId = btn.getAttribute("data-save-grade");
            const scoreInp = document.getElementById("inp-score-" + attId);
            const fbInp = document.getElementById("inp-fb-" + attId);
            await saveCloudGrade(
              attId,
              scoreInp ? scoreInp.value.trim() : "",
              fbInp ? fbInp.value.trim() : ""
            );
          };
        });

        document.querySelectorAll("[data-ai-grade]").forEach(btn => {
          btn.onclick = () => triggerTeacherAiGrade(btn.getAttribute("data-ai-grade"));
        });

        document.querySelectorAll("[data-release-now]").forEach(btn => {
          btn.onclick = () => releaseAiReviewNow(btn.getAttribute("data-release-now"));
        });

        document.querySelectorAll("[data-speak-word]").forEach(el => {
          el.onclick = e => {
            e.stopPropagation();
            speakEnglishText(el.getAttribute("data-speak-word"));
          };
        });
      }

      document.addEventListener("click", e => {
        if (tState.accountMenuOpen && !e.target.closest("#teacher-account-menu-wrap")) {
          tState.accountMenuOpen = false;
          renderTeacherApp();
        }
      });

      document.addEventListener("keydown", e => {
        if (e.key === "Escape" && (tState.accountMenuOpen || tState.infoModalStudentId)) {
          tState.accountMenuOpen = false;
          tState.infoModalStudentId = "";
          renderTeacherApp();
        }
      });

      window.addEventListener("DOMContentLoaded", async () => {
        const client = CLOUD.getClient();
        if (!client) {
          window.location.replace("./index.html");
          return;
        }

        renderTeacherApp();
        const { data } = await client.auth.getSession();
        if (!data || !data.session || !data.session.user) {
          window.location.replace("./index.html");
          return;
        }
        await verifyAndLoadCloudTeacher(data.session.user);

        client.auth.onAuthStateChange(async (event, session) => {
          if (event === "SIGNED_IN" && session && session.user && !tState.authenticated) {
            await verifyAndLoadCloudTeacher(session.user);
          } else if (event === "SIGNED_OUT") {
            window.location.replace("./index.html");
          }
        });
      });
    })();
  </script>
</body>
</html>
